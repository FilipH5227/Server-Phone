<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DeskGuard Mobile</title>
    <style>
        :root {
            --bg-color: #FFFFFF;
            --card-bg: #F8F9FA;
            --primary-blue: #0078D4;
            --text-dark: #111827;
            --text-muted: #6C757D;
            --border-color: #E0E0E0;
            --danger-color: #E81123;
            --pin-bg: #1E222D;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-dark); display: flex; flex-direction: column; min-height: 100vh; align-items: center; }

        /* HEADER */
        .app-header { width: 100%; padding: 12px 18px; display: flex; align-items: center; background: #FFFFFF; border-bottom: 1px solid #F0F0F0; gap: 8px; }
        .header-icon { width: 26px; height: 26px; object-fit: contain; }
        .brand-title { font-size: 16px; font-weight: 700; color: var(--primary-blue); }

        .container { width: 100%; max-width: 420px; padding: 20px; display: flex; flex-direction: column; align-items: center; flex: 1; }

        /* AUTH VIEW */
        #auth-view { width: 100%; display: flex; flex-direction: column; align-items: center; padding-top: 15px; }
        .auth-card { width: 100%; background-color: var(--card-bg); border-radius: 20px; padding: 25px 20px; display: flex; flex-direction: column; align-items: center; }
        .auth-title { font-size: 22px; font-weight: 700; color: var(--primary-blue); display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .auth-logo { width: 36px; height: 36px; object-fit: contain; }
        .auth-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
        
        .input-field { width: 100%; height: 44px; border: 1px solid var(--border-color); border-radius: 10px; padding: 0 14px; margin-bottom: 12px; outline: none; background: #FFF; font-size: 14px; }
        .input-field:focus { border-color: var(--primary-blue); }
        .btn-primary { width: 100%; height: 46px; background-color: var(--primary-blue); color: white; font-size: 15px; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; margin-top: 5px; }
        .btn-link { background: none; border: none; color: var(--primary-blue); font-size: 12px; margin-top: 12px; cursor: pointer; }

        /* PAIRING VIEW */
        #pairing-view { width: 100%; display: none; flex-direction: column; align-items: center; padding-top: 25px; }
        .pair-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
        .pair-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 25px; text-align: center; }
        .pin-inputs { display: flex; gap: 6px; margin-bottom: 25px; }
        .pin-input-box { width: 44px; height: 56px; background-color: var(--pin-bg); color: #FFFFFF; font-size: 22px; font-weight: bold; text-align: center; border-radius: 10px; border: none; text-transform: uppercase; }

        /* DASHBOARD VIEW */
        #dashboard-view { width: 100%; display: none; flex-direction: column; align-items: center; }
        .pc-card { width: 100%; background-color: var(--card-bg); border-radius: 16px; padding: 25px; display: flex; flex-direction: column; align-items: center; margin-bottom: 25px; }
        .pc-icon { width: 70px; height: 55px; margin-bottom: 12px; }
        .pc-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        .pc-status { font-size: 13px; font-weight: 600; color: var(--text-muted); }
        .pc-status.online { color: #10B981; }

        /* BUTTONS SECTION */
        .options-section { width: 100%; display: flex; flex-direction: column; gap: 12px; }
        .btn-action { width: 100%; height: 50px; background-color: #FFFFFF; color: var(--text-dark); border: 1.5px solid var(--border-color); border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s; }
        .btn-action:active { background-color: #F3F4F6; }
        .btn-danger { color: var(--danger-color); border-color: var(--danger-color); }

        .status-msg { margin-top: 10px; font-size: 12px; text-align: center; color: var(--danger-color); }

        /* FULLSCREEN OVERLAY (CONTROL & LIVE VIEW) */
        #fullscreen-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000000; z-index: 9999; flex-direction: column; justify-content: center; align-items: center; }
        #fs-stream { width: 100%; height: 100%; object-fit: contain; }
        .close-fs { position: absolute; top: 18px; right: 18px; background: rgba(0,0,0,0.6); color: white; border: 1.5px solid white; border-radius: 50%; width: 38px; height: 38px; font-size: 18px; font-weight: bold; cursor: pointer; z-index: 10000; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <header class="app-header">
        <img src="edited-image.png" class="header-icon" onerror="this.style.display='none'" alt="Icon"/>
        <span class="brand-title">DeskGuard</span>
    </header>

    <div class="container">
        <div id="auth-view">
            <div class="auth-card">
                <h2 class="auth-title">
                    <img src="edited-image.png" class="auth-logo" onerror="this.style.display='none'" alt="Logo"/>
                    DeskGuard
                </h2>
                <p class="auth-sub">Mobile Remote Agent</p>

                <input type="text" id="username-input" class="input-field" placeholder="Username" />
                <input type="password" id="password-input" class="input-field" placeholder="Password" />

                <button class="btn-primary" id="btn-auth-action" onclick="handleAuth()">Log In</button>
                <button class="btn-link" id="btn-auth-toggle" onclick="toggleAuthMode()">Don't have an account? Create one</button>
                <p id="auth-status" class="status-msg"></p>
            </div>
        </div>

        <div id="pairing-view">
            <h2 class="pair-title">Enter PC Pairing Code</h2>
            <p class="pair-subtitle">Enter the 6-character PIN displayed on your PC</p>
            <div class="pin-inputs">
                <input type="text" maxlength="1" class="pin-input-box" />
                <input type="text" maxlength="1" class="pin-input-box" />
                <input type="text" maxlength="1" class="pin-input-box" />
                <input type="text" maxlength="1" class="pin-input-box" />
                <input type="text" maxlength="1" class="pin-input-box" />
                <input type="text" maxlength="1" class="pin-input-box" />
            </div>
            <button class="btn-primary" onclick="connectToPC(false)">Connect to PC</button>
            <p id="pair-status" class="status-msg"></p>
        </div>

        <div id="dashboard-view">
            <div class="pc-card">
                <svg class="pc-icon" viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="5" y="5" width="90" height="55" rx="8" stroke="#000000" stroke-width="8" fill="#0078D4"/>
                    <rect x="38" y="60" width="8" height="12" fill="#000000"/>
                    <rect x="54" y="60" width="8" height="12" fill="#000000"/>
                    <rect x="22" y="72" width="56" height="6" rx="3" fill="#000000"/>
                </svg>
                <h3 class="pc-name">My PC</h3>
                <span id="pc-status-label" class="pc-status">Offline</span>
            </div>

            <div class="options-section">
                <button class="btn-action btn-danger" onclick="sendControl('LOCK')">🔒 Lock</button>
                <button class="btn-action" onclick="openFullscreen(true)">🎮 Control PC</button>
                <button class="btn-action" onclick="openFullscreen(false)">👁️ Live View</button>
            </div>
        </div>
    </div>

    <div id="fullscreen-overlay">
        <div class="close-fs" onclick="closeFullscreen()">✕</div>
        <img id="fs-stream" alt="Fullscreen Stream"/>
    </div>

    <script>
        const SERVER_URL = "wss://server-3ig6.onrender.com";
        let socket = null;
        let authMode = "LOGIN";
        let lastFrameTime = 0;
        let isControlMode = false;

        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem("dg_user");
            const savedPass = localStorage.getItem("dg_pass");
            const isPaired = localStorage.getItem("dg_paired") === "true";

            if (savedUser && savedPass) {
                document.getElementById("username-input").value = savedUser;
                document.getElementById("password-input").value = savedPass;
                document.getElementById("auth-view").style.display = "none";

                if (isPaired) {
                    connectToPC(true);
                } else {
                    document.getElementById("pairing-view").style.display = "flex";
                }
            }
        });

        const inputs = document.querySelectorAll('.pin-input-box');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) inputs[index + 1].focus();
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) inputs[index - 1].focus();
            });
        });

        function toggleAuthMode() {
            const btnAction = document.getElementById("btn-auth-action");
            const btnToggle = document.getElementById("btn-auth-toggle");
            if (authMode === "LOGIN") {
                authMode = "REGISTER";
                btnAction.innerText = "Create Account";
                btnToggle.innerText = "Already have an account? Log In";
            } else {
                authMode = "LOGIN";
                btnAction.innerText = "Log In";
                btnToggle.innerText = "Don't have an account? Create one";
            }
        }

        function handleAuth() {
            const user = document.getElementById("username-input").value.trim();
            const pass = document.getElementById("password-input").value.trim();
            if (!user || !pass) return;

            localStorage.setItem("dg_user", user);
            localStorage.setItem("dg_pass", pass);

            document.getElementById("auth-view").style.display = "none";
            document.getElementById("pairing-view").style.display = "flex";
        }

        function connectToPC(autoReconnect = false) {
            let pin = "";
            inputs.forEach(i => pin += i.value.trim().toUpperCase());
            const pairStatus = document.getElementById("pair-status");

            if (!autoReconnect && pin.length < 6) {
                pairStatus.innerText = "Enter all 6 characters.";
                return;
            }

            pairStatus.style.color = "#0078D4";
            pairStatus.innerText = "Connecting to PC...";

            if (socket) socket.close();
            socket = new WebSocket(SERVER_URL);

            socket.onopen = () => {
                const user = localStorage.getItem("dg_user");
                const pass = localStorage.getItem("dg_pass");
                socket.send(JSON.stringify({
                    type: "PAIR_MOBILE",
                    username: user,
                    password: pass,
                    pin: autoReconnect ? "AUTO" : pin
                }));
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === "PAIR_SUCCESS") {
                    localStorage.setItem("dg_paired", "true");
                    document.getElementById("pairing-view").style.display = "none";
                    document.getElementById("dashboard-view").style.display = "flex";
                    socket.send(JSON.stringify({ type: "FORCE_UPDATE_UI" }));
                } 
                else if (data.type === "stream" && data.image) {
                    lastFrameTime = Date.now();
                    const imgSrc = "data:image/jpeg;base64," + data.image;
                    document.getElementById("fs-stream").src = imgSrc;
                    setPcStatus(true);
                } 
                else if (data.type === "PAIR_FAILED") {
                    localStorage.removeItem("dg_paired");
                    pairStatus.style.color = "#E81123";
                    pairStatus.innerText = data.message || "Invalid PIN.";
                    document.getElementById("pairing-view").style.display = "flex";
                    document.getElementById("dashboard-view").style.display = "none";
                }
            };
        }

        setInterval(() => {
            if (Date.now() - lastFrameTime > 3000) {
                setPcStatus(false);
            }
        }, 1000);

        function setPcStatus(isOnline) {
            const label = document.getElementById("pc-status-label");
            if (isOnline) {
                label.innerText = "Online";
                label.classList.add("online");
            } else {
                label.innerText = "Offline";
                label.classList.remove("online");
            }
        }

        function sendControl(action) {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: "command", action: action }));
            }
        }

        function openFullscreen(allowControl) {
            isControlMode = allowControl;
            const overlay = document.getElementById("fullscreen-overlay");
            overlay.style.display = "flex";
            
            if (overlay.requestFullscreen) overlay.requestFullscreen();
            else if (overlay.webkitRequestFullscreen) overlay.webkitRequestFullscreen();
        }

        function closeFullscreen() {
            document.getElementById("fullscreen-overlay").style.display = "none";
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }

        document.getElementById("fs-stream").addEventListener("click", () => {
            if (isControlMode) sendControl("CLICK");
        });
    </script>
</body>
</html>
