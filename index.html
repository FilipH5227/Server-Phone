<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeskGuard Mobile</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      color: #334155;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 24px;
      background-color: #ffffff;
      border-bottom: 1px solid #e2e8f0;
    }

    .header-logo {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .header-title {
      font-size: 18px;
      font-weight: 700;
      color: #0284c7;
    }

    /* Content Area */
    .content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Card */
    .card {
      background: #f1f5f9;
      width: 100%;
      max-width: 420px;
      padding: 40px 32px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      text-align: center;
    }

    .card-title {
      font-size: 24px;
      font-weight: 700;
      color: #0284c7;
      margin-bottom: 12px;
    }

    .card-subtitle {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 28px;
    }

    /* Inputs */
    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .input-field {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      background: #ffffff;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: #0284c7;
    }

    /* PIN Inputs */
    .pin-container {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 24px;
    }

    .pin-box {
      width: 48px;
      height: 56px;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      background: #ffffff;
      outline: none;
      text-transform: uppercase;
    }

    .pin-box:focus {
      border-color: #0284c7;
    }

    /* Buttons */
    .btn-primary {
      width: 100%;
      padding: 14px;
      background-color: #0284c7;
      color: #ffffff;
      font-weight: 600;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-primary:hover {
      background-color: #0369a1;
    }

    .link-btn {
      display: inline-block;
      margin-top: 18px;
      color: #0284c7;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .link-btn:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

  <main class="content">
    
    <div id="pinScreen" class="card">
      <h1 class="card-title">Enter PIN</h1>
      <p class="card-subtitle">Enter the 6-character PIN displayed on your PC Agent app.</p>
      
      <div class="pin-container">
        <input type="text" class="pin-box" maxlength="1" oninput="moveNext(this, 0)">
        <input type="text" class="pin-box" maxlength="1" oninput="moveNext(this, 1)">
        <input type="text" class="pin-box" maxlength="1" oninput="moveNext(this, 2)">
        <input type="text" class="pin-box" maxlength="1" oninput="moveNext(this, 3)">
        <input type="text" class="pin-box" maxlength="1" oninput="moveNext(this, 4)">
        <input type="text" class="pin-box" maxlength="1" oninput="moveNext(this, 5)">
      </div>

      <button class="btn-primary" onclick="pairAndConnect()">Pair & Connect</button>
      <div>
        <a class="link-btn" onclick="toggleScreen('loginScreen')">Switch Account</a>
      </div>
    </div>

    <div id="loginScreen" class="card hidden">
      <h1 class="card-title">DeskGuard PC</h1>
      
      <div class="input-group">
        <input type="text" id="username" class="input-field" placeholder="Username" value="Filip">
      </div>
      
      <div class="input-group">
        <input type="password" id="password" class="input-field" placeholder="Password" value="********">
      </div>

      <button class="btn-primary" onclick="login()">Log In</button>
      <div>
        <a class="link-btn" onclick="alert('Înregistrare cont...')">Don't have an account? Create one</a>
      </div>
    </div>

  </main>

  <script>
    const pinInputs = document.querySelectorAll('.pin-box');

    function moveNext(input, index) {
      if (input.value.length === 1 && index < pinInputs.length - 1) {
        pinInputs[index + 1].focus();
      }
    }

    // Suport pentru Backspace
    pinInputs.forEach((input, index) => {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && index > 0) {
          pinInputs[index - 1].focus();
        }
      });
    });

    function toggleScreen(screenId) {
      document.getElementById('pinScreen').classList.add('hidden');
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById(screenId).classList.remove('hidden');
    }

    function pairAndConnect() {
      let pin = Array.from(pinInputs).map(i => i.value).join('');
      if (pin.length === 6) {
        alert('Conectat cu succes folosind PIN-ul: ' + pin);
      } else {
        alert('Vă rugăm să introduceți un PIN valid de 6 caractere.');
      }
    }

    function login() {
      toggleScreen('pinScreen');
    }
  </script>
</body>
</html>
